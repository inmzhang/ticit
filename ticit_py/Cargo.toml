[package]
name = "ticit_py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Python bindings for ticit"
repository.workspace = true
publish = false

[features]
default = []
gpu = ["ticit/gpu"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[lints.rust]
unsafe_code = "allow"

[dependencies]
num-complex = "0.4.6"
numpy = "0.29"
pyo3 = { version = "0.29.2", features = ["abi3-py310", "num-complex"] }
pyo3-stub-gen = { version = "0.23.0", default-features = false, features = ["infer_signature", "numpy"] }
ticit = { path = ".." }

[[bin]]
name = "stub_gen"
doc = false
